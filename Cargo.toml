[workspace]
resolver = "3"
members = ["."]

[package]
name = "nanomath"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Minimal, fast and safe mathematical operations for low-level and no_std Rust applications."
repository = "https://github.com/nanocrates/nanobase"
readme = "README.md"

[lints]
workspace = true

[workspace.lints.rust]
missing_docs = "warn"
